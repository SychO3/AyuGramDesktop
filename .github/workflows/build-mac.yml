name: Build macOS (arm64 Release)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: build-mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS arm64
    runs-on: macos-latest

    env:
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"
      ARTIFACT_ZIP: "AyuGram-macOS-arm64.zip"

    steps:
      - name: Get repository name.
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Clone.
        uses: actions/checkout@v6
        with:
          submodules: recursive
          path: ${{ env.REPO_NAME }}

      - name: First set up.
        run: |
          brew update
          brew install automake libtool meson nasm ninja pkg-config || true
          sudo mdutil -a -i off || true
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Libraries cache.
        id: cache-libs
        uses: actions/cache@v5
        with:
          path: |
            Libraries
            ThirdParty
          key: ${{ runner.OS }}-arm64-libs-${{ hashFiles(format('{0}/{1}', env.REPO_NAME, env.PREPARE_PATH)) }}
          restore-keys: ${{ runner.OS }}-arm64-libs-

      - name: Libraries.
        run: |
          ./$REPO_NAME/Telegram/build/prepare/mac.sh silent

      - name: Free up some disk space.
        run: |
          find Libraries '(' '(' ! '(' -name '*.a' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -perm +111 ')' -type f ')' -o -empty ')' -delete || true

      - name: Resolve API credentials.
        run: |
          if [ -n "${{ secrets.TDESKTOP_API_ID }}" ] && [ -n "${{ secrets.TDESKTOP_API_HASH }}" ]; then
            echo "Using repository API credentials."
            echo "API_ARGS=-D TDESKTOP_API_ID=${{ secrets.TDESKTOP_API_ID }} -D TDESKTOP_API_HASH=${{ secrets.TDESKTOP_API_HASH }}" >> $GITHUB_ENV
          else
            echo "Falling back to public API credentials (2040)."
            echo "API_ARGS=-D TDESKTOP_API_ID=2040 -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627" >> $GITHUB_ENV
          fi

      - name: Configure (Release, arm64).
        run: |
          cd $REPO_NAME/Telegram
          ./configure.sh \
          -D CMAKE_CONFIGURATION_TYPES=Release \
          -D CMAKE_OSX_ARCHITECTURES=arm64 \
          -D CMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
          -D CMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON \
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON \
          $API_ARGS

      - name: Build.
        run: |
          cd $REPO_NAME
          cmake --build out --config Release --target Telegram --parallel

      - name: Compile app icons.
        run: |
          APP="$REPO_NAME/out/Release/AyuGram.app"
          RESOURCES="$APP/Contents/Resources"
          ICONS_SRC="$REPO_NAME/Telegram/Telegram"

          # Remove raw .icon directories that Xcode only copied without compiling
          find "$RESOURCES" -name "*.icon" -type d -exec rm -rf {} + 2>/dev/null || true

          # Generate default icon from iconset
          iconutil --convert icns --output "$RESOURCES/AppIcon-Default.icns" \
            "$ICONS_SRC/Images.xcassets/Icon.iconset"

      - name: Codesign (ad-hoc, hardened runtime).
        run: |
          APP="$REPO_NAME/out/Release/AyuGram.app"
          /usr/bin/codesign --force --deep --sign - --options runtime --timestamp=none "$APP"
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Package.
        run: |
          cd $REPO_NAME/out/Release
          /usr/bin/ditto -c -k --keepParent --sequesterRsrc AyuGram.app "$GITHUB_WORKSPACE/$ARTIFACT_ZIP"

      - name: Upload artifact.
        uses: actions/upload-artifact@v7
        with:
          name: AyuGram-macOS-arm64
          path: ${{ env.ARTIFACT_ZIP }}

      - name: Publish to Release.
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARTIFACT_ZIP }}
          fail_on_unmatched_files: true
