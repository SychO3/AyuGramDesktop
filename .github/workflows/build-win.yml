name: Build Windows (x64 Release)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: build-win-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2022

    env:
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"
      ARTIFACT_ZIP: "AyuGram-Windows-x64.zip"

    defaults:
      run:
        shell: cmd

    steps:
      - name: Prepare directories.
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: Get repository name.
        shell: bash
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Clone.
        uses: actions/checkout@v6
        with:
          submodules: recursive
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}

      - name: First set up.
        shell: bash
        run: |
          DOCPATH=$TBUILD/$REPO_NAME/docs/building-win-x64.md
          SDK="$(grep 'SDK version' $DOCPATH | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> $GITHUB_ENV

          sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' "$PROGRAMFILES"/CMake/share/cmake*/Modules/Platform/Windows-MSVC.cmake || true

          echo "$(sha256sum $TBUILD/$REPO_NAME/$PREPARE_PATH | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV

          git config --global user.email "you@example.com"
          git config --global user.name "Sample"

      - uses: Eden-CI/msvc-dev-cmd@master
        name: Native Tools Command Prompt.
        with:
          arch: x64
          sdk: ${{ env.SDK }}
          toolset: '14.44'

      - name: NuGet sources.
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: ThirdParty cache (restore).
        id: cache-thirdparty
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-x64-third-party-${{ env.CACHE_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.OS }}-x64-third-party-${{ env.CACHE_KEY }}-
            ${{ runner.OS }}-x64-third-party-

      - name: Libraries cache (restore).
        id: cache-libs
        uses: actions/cache/restore@v5
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-libs-${{ env.CACHE_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.OS }}-x64-libs-${{ env.CACHE_KEY }}-
            ${{ runner.OS }}-x64-libs-

      - name: Qt cache (restore).
        id: cache-qt
        uses: actions/cache/restore@v5
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-qt-${{ env.CACHE_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.OS }}-x64-qt-${{ env.CACHE_KEY }}-
            ${{ runner.OS }}-x64-qt-

      - name: Free up disk space before building.
        shell: pwsh
        run: |
          $targets = @(
            "C:\Android",
            "C:\Program Files\MongoDB",
            "C:\Program Files\MySQL",
            "C:\Program Files\PostgreSQL",
            "C:\Program Files\Microsoft SQL Server",
            "C:\Program Files (x86)\Microsoft SQL Server",
            "C:\Program Files\Unity",
            "C:\Program Files\dotnet\sdk",
            "C:\Program Files\Google\Chrome",
            "C:\Program Files (x86)\Google",
            "C:\Program Files\Mozilla Firefox",
            "C:\Program Files\Microsoft\jdk-*",
            "C:\Program Files\R",
            "C:\Program Files\Amazon",
            "C:\Strawberry",
            "C:\Julia*",
            "C:\hostedtoolcache\windows\Java*",
            "C:\hostedtoolcache\windows\Ruby",
            "C:\hostedtoolcache\windows\go",
            "C:\hostedtoolcache\windows\node",
            "C:\selenium"
          )
          foreach ($t in $targets) {
            foreach ($p in (Get-Item $t -ErrorAction SilentlyContinue)) {
              try {
                Remove-Item -LiteralPath $p.FullName -Recurse -Force -ErrorAction Stop
                Write-Host "Removed $($p.FullName)"
              } catch {
                Write-Host "Skip $($p.FullName): $($_.Exception.Message)"
              }
            }
          }
          Get-PSDrive -PSProvider FileSystem | Format-Table Name,Used,Free

      - name: Libraries.
        timeout-minutes: 320
        run: |
          %TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat silent

      - name: ThirdParty cache (save).
        if: always()
        uses: actions/cache/save@v5
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-x64-third-party-${{ env.CACHE_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Libraries cache (save).
        if: always()
        uses: actions/cache/save@v5
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-libs-${{ env.CACHE_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Qt cache (save).
        if: always()
        uses: actions/cache/save@v5
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-qt-${{ env.CACHE_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Resolve API credentials.
        shell: bash
        run: |
          if [ -n "${{ secrets.TDESKTOP_API_ID }}" ] && [ -n "${{ secrets.TDESKTOP_API_HASH }}" ]; then
            echo "Using repository API credentials."
            echo "API_ARGS=-D TDESKTOP_API_ID=${{ secrets.TDESKTOP_API_ID }} -D TDESKTOP_API_HASH=${{ secrets.TDESKTOP_API_HASH }}" >> $GITHUB_ENV
          else
            echo "Falling back to public API credentials (2040)."
            echo "API_ARGS=-D TDESKTOP_API_ID=2040 -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627" >> $GITHUB_ENV
          fi

      - name: Free up some disk space.
        shell: bash
        run: find $LibrariesPath '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' ')' -type f ')' -o -empty ')' -delete || true

      - name: Configure and build (Release, x64).
        run: |
          cd %TBUILD%\%REPO_NAME%\Telegram
          call configure.bat x64 ^
          %API_ARGS% ^
          -D CMAKE_CONFIGURATION_TYPES=Release ^
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON ^
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON
          if %errorlevel% neq 0 exit /b %errorlevel%
          cmake --build ..\out --config Release --target Telegram --parallel
          if %errorlevel% neq 0 exit /b %errorlevel%

      - name: Package.
        shell: pwsh
        run: |
          $out = "$env:TBUILD\$env:REPO_NAME\out\Release"
          $stage = "$env:GITHUB_WORKSPACE\stage"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "$out\AyuGram.exe" $stage\
          if (Test-Path "$out\Updater.exe") { Copy-Item "$out\Updater.exe" $stage\ }
          Compress-Archive -Path "$stage\*" -DestinationPath "$env:GITHUB_WORKSPACE\$env:ARTIFACT_ZIP" -Force

      - name: Upload artifact.
        uses: actions/upload-artifact@v7
        with:
          name: AyuGram-Windows-x64
          path: ${{ env.ARTIFACT_ZIP }}

      - name: Publish to Release.
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARTIFACT_ZIP }}
          fail_on_unmatched_files: true
